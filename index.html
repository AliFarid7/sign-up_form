<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="img-container">
        <img src="./img/tobias-reich-cIIUivbFzCs-unsplash.jpg" alt="Picture of urban area" width="400px" height="700px">
        <p class="photo-credit">Photo by <a
                href="https://unsplash.com/@electerious?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Tobias
                Reich</a> on <a
                href="https://unsplash.com/photos/city-street-at-night-with-tall-buildings-and-car-cIIUivbFzCs?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </p>
        <div class="logo">
            <h1> <img src="./img/odin-lined.png" alt="Picture of Odin" width="75px" height="75px">Logo</h1>
        </div>
    </div>
    <div class="container">
        <div class="first-part">
            <div class="intro">This is not a real online service! You know you need something like this in your life to
                help
                you realize your deepest dreams. Sign up <em>now</em> to get started.</div>
            <div class="sub-intro">You <em>know</em> you want to.</div>
        </div>
        <div class="second-part">
            <div class="second-txt">Let's do this!</div>
            <form action="/action-store" method="post">
                <fieldset>
                    <div>
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required maxlength="30">
                    </div>
                    <div>
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required maxlength="30">
                    </div>
                </fieldset>
                <fieldset>
                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required maxlength="60">
                    </div>
                    <div>
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="tel" id="phone_number" name="phone_number" required pattern="^01[0-2,5]{1}[0-9]{8}$">
                    </div>
                </fieldset>
                <fieldset>
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required maxlength="60" pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}$" title="Must be at least 8 characters and include an uppercase letter, lowercase letter, number, and special character">
                    </div>
                    <div>
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="confirm_password" required maxlength="60" pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}$" title="Must be at least 8 characters and include an uppercase letter, lowercase letter, number, and special character">
                    </div>
                </fieldset>
        </div>
        <div class="third-part">
            <button type="submit">Create an Account</button>
            <div>Already have an account? <em>Log In</em></div>
        </div>
        </form>
    </div>
</body>

</html>
